apiVersion: apps/v1
kind: Deployment
metadata:
  name: amf
  namespace: go5gc-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amf
  template:
    metadata:
      labels:
        app: amf
    spec:
      containers:
        - name: amf
          image: go5gc-amf:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: amf
  namespace: go5gc-lab
spec:
  selector:
    app: amf
  ports:
    - name: http
      port: 8081
      targetPort: 8081
