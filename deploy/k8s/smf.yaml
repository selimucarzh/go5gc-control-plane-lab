apiVersion: apps/v1
kind: Deployment
metadata:
  name: smf
  namespace: go5gc-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smf
  template:
    metadata:
      labels:
        app: smf
    spec:
      containers:
        - name: smf
          image: go5gc-smf:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: AMF_BASE_URL
              value: http://amf:8081
          ports:
            - containerPort: 8082
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: smf
  namespace: go5gc-lab
spec:
  selector:
    app: smf
  ports:
    - name: http
      port: 8082
      targetPort: 8082
